services:
  - type: web
    name: contra-api
    runtime: python
    region: oregon
    plan: free
    rootDir: contra
    buildCommand: pip install -e ".[gate,api]"
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PULSE_LLM_PROVIDER
        value: anthropic
      - key: PULSE_LLM_AUTO_SWITCH
        value: "true"
      - key: PULSE_SEARCH_PROVIDER
        value: anthropic
      # claude-3-5-sonnet-20241022 was retired — do not set an old ANTHROPIC_SEARCH_MODEL in the dashboard
      - key: ANTHROPIC_SEARCH_MODEL
        value: claude-sonnet-4-6
      # Tavily optional — miner/gate use Claude web_search when unset
      # Production hardening — set secrets in the Render dashboard
      - key: CORS_DEV_REGEX
        value: "0"
      - key: PROSPECTOR_AUTORUN
        value: "false"
      # Cap LP-miner wall time + estimated spend (see GET /api/prospector/costs)
      - key: PROSPECTOR_MAX_RUNTIME_SEC
        value: "600"
      - key: PROSPECTOR_MAX_RUN_COST_USD
        value: "3"
      - key: PROSPECTOR_MAX_DAILY_COST_USD
        value: "8"
      - key: PROSPECTOR_MAX_RUNS_PER_DAY
        value: "4"
      - key: PROSPECTOR_ZERO_YIELD_PAUSE
        value: "3"
      - key: CONSOLE_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MOTHERDUCK_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
